# Plays the part of DSM's web server with its Reverse Proxy rules:
# vtuner.com names on port 80 go to vtunerd, every other host name does not.
# The wildcard is a convenience for testing: on DSM, each exact name needs its own rule.

server {
    listen 80;
    server_name vtuner.com *.vtuner.com;

    # In this environment vtunerd runs without an admin token, and this port is published to the network.
    location /admin {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8580;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # stream relayed audio without buffering
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}

# Any other host name: stands in for DSM's own pages.
server {
    listen 80 default_server;
    default_type text/plain;
    return 200 "This is not a vtuner.com host name. On a NAS, DSM would answer here.\n";
}

# Admin UI for testing, published on 127.0.0.1 only (see compose.yaml).
server {
    listen 8080;  # inside the container only; compose.yaml maps it to VTUNER_ADMIN_PORT
    absolute_redirect off;
    location = / {
        return 302 /admin/;
    }
    location / {
        proxy_pass http://127.0.0.1:8580;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
}
